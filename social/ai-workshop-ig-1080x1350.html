<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;}
.canvas{position:relative;width:1080px;height:1350px;overflow:hidden;
  font-family:'Barlow',sans-serif;background:#2B1F18;}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%;}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(43,31,24,.74) 0%, rgba(43,31,24,.30) 24%, rgba(43,31,24,.34) 46%,
  rgba(43,31,24,.86) 72%, rgba(43,31,24,.97) 100%);}
.bar{position:absolute;top:0;left:0;right:0;height:15px;
  background:linear-gradient(90deg,#C19D5F,#B8593A);z-index:3;}
.head{position:absolute;top:74px;left:0;right:0;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:40px;}
.logo{height:118px;object-fit:contain;filter:drop-shadow(0 2px 12px rgba(0,0,0,.45));}
.eyebrow{color:#E9C58C;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  font-size:27px;text-shadow:0 1px 8px rgba(0,0,0,.6);}
.wrap{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:0 86px 90px;text-align:center;}
.title{font-family:'DM Serif Display',serif;color:#FBF6EE;font-size:104px;line-height:.96;
  text-shadow:0 2px 18px rgba(0,0,0,.65);}
.title .a{color:#E9C58C;font-style:italic;}
.sub{color:#F3E7D3;font-size:33px;font-weight:500;line-height:1.36;margin-top:23px;
  text-shadow:0 1px 10px rgba(0,0,0,.6);}
.facts{display:inline-flex;align-items:center;gap:24px;margin-top:33px;
  color:#FBF6EE;font-family:'DM Serif Display',serif;font-size:40px;
  text-shadow:0 1px 10px rgba(0,0,0,.6);}
.facts .d{color:#E9C58C;font-family:'Barlow';font-weight:700;}
.note{color:#E9C58C;font-size:27px;font-weight:600;margin-top:24px;
  letter-spacing:.01em;text-shadow:0 1px 8px rgba(0,0,0,.6);}
.contact{color:#EBDCC4;font-size:25px;font-weight:600;line-height:1.5;
  margin-top:37px;text-shadow:0 1px 8px rgba(0,0,0,.6);}
.contact b{color:#FBF6EE;font-weight:700;}
