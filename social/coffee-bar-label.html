<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Patio Coffee Bar Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap">
<style>
  :root{
    --cream:#FBF6EE;
    --ink:#2B1F18;
    --terra:#B8593A;
    --teal:#617C7B;
    --gold:#C19D5F;
    --galao:#726651;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe7d8;font-family:"Barlow",system-ui,sans-serif;color:var(--ink)}

  /* One A6 landscape card (148 x 105 mm). Print at 100% / actual size. */
  .card{
    width:148mm;height:105mm;
    background:var(--cream);
    position:relative;
    overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:12mm 14mm;
    margin:0 auto;
  }
  /* thin inner keyline, tote-bag minimal */
  .card::before{
    content:"";position:absolute;inset:5mm;
    border:0.5mm solid var(--terra);
    border-radius:2mm;
    opacity:.55;
    pointer-events:none;
  }

  .eyebrow{
    font-family:"Barlow Semi Condensed",sans-serif;
    font-weight:600;letter-spacing:.28em;text-transform:uppercase;
    font-size:10.5pt;color:var(--gold);
    margin-bottom:5mm;
  }

  .cup{width:15mm;height:15mm;margin-bottom:4mm}
  .cup path,.cup line{stroke:var(--terra);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .steam{stroke:var(--gold);stroke-width:4.5;opacity:.9}

  h1{
    font-family:"DM Serif Display",Georgia,serif;font-weight:400;
    font-size:40pt;line-height:1;color:var(--ink);
    letter-spacing:.01em;
  }
  .sub{
    font-family:"DM Serif Display",serif;font-style:italic;
    font-size:19pt;color:var(--terra);
    margin-top:3mm;
  }
  .en{
    font-family:"Barlow",sans-serif;font-weight:400;
    font-size:12pt;color:var(--galao);
    margin-top:4mm;line-height:1.4;max-width:110mm;
  }
  .en b{color:var(--teal);font-weight:600}

  .rule{width:18mm;height:0.6mm;background:var(--gold);margin:6mm 0 5mm;border-radius:2px}

  .foot{
    display:flex;align-items:center;gap:3.5mm;
    font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-style:italic;
    letter-spacing:.03em;font-size:11.5pt;color:var(--galao);
  }
  .foot svg{height:8.5mm;width:auto;display:block}

  @page{size:148mm 105mm;margin:0}
  @media print{
    html,body{background:#fff}
    .card{margin:0}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">O canto do café · Patio</div>

    <svg class="cup" viewBox="0 0 100 100" aria-hidden="true">
      <!-- steam -->
      <path class="steam" d="M40 20 q6 -8 0 -16"/>
      <path class="steam" d="M52 20 q6 -8 0 -16"/>
      <path class="steam" d="M64 20 q6 -8 0 -16"/>
      <!-- cup body -->
      <path d="M22 34 h50 v20 a25 25 0 0 1 -50 0 z"/>
      <!-- handle -->
      <path d="M72 38 h8 a10 10 0 0 1 0 20 h-6"/>
      <!-- saucer -->
      <line x1="16" y1="86" x2="84" y2="86"/>
    </svg>

    <h1>Cafezinho?</h1>
    <div class="sub">Contribuição bem-vinda&nbsp;☕</div>

    <div class="rule"></div>

    <p class="en">Serve-te à vontade, café ou chá.<br>
    <b>Help yourself</b> to a coffee or tea. A small contribution keeps the pot full.</p>
