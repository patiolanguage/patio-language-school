<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;}
body{font-family:'Barlow',sans-serif;background:#FBF6EE;color:#2B1F18;position:relative;}
.bar{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#617C7B,#C19D5F);}
.wrap{position:absolute;left:56px;right:56px;top:130px;bottom:300px;display:flex;flex-direction:column;}
.top{position:relative;height:360px;flex:none;}
.top .ph{width:100%;height:100%;object-fit:cover;object-position:center 50%;border-radius:30px;display:block;box-shadow:0 14px 34px rgba(43,31,24,.16);}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px;flex:none;}
.head img{height:130px;display:block;}
.qr{flex:none;background:#fff;border-radius:14px;padding:8px 8px 6px;text-align:center;}
.qr img{width:210px;height:210px;display:block;}
.qr div{font-weight:700;font-size:27px;color:#2B1F18;margin-top:2px;}
.new{display:flex;align-items:center;gap:16px;background:#617C7B;color:#FBF6EE;font-weight:700;font-size:52px;line-height:1.1;padding:12px 30px 12px 14px;border-radius:999px;box-shadow:0 6px 16px rgba(43,31,24,.15);}
.new .tg{background:#C19D5F;color:#2B1F18;font-size:31px;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px;border-radius:999px;}
.bubble{position:absolute;left:30px;bottom:30px;background:#fff;border-radius:28px;padding:14px 34px 18px;box-shadow:0 10px 26px rgba(0,0,0,.22);}
.bubble span{font-family:'DM Serif Display',serif;font-size:62px;line-height:1;color:#2B1F18;}
.bubble i{color:#B8593A;}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:100px;line-height:1.02;margin-top:36px;}
h1 .a{color:#B8593A;font-style:italic;}
.t2{font-family:'DM Serif Display',serif;font-size:68px;line-height:1.05;color:#726651;margin-top:6px;}
.t2 .a{color:#B8593A;font-style:italic;}
.easy{font-size:48px;font-weight:600;color:#4a4038;margin-top:18px;}
.ticks{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;}
.tick{background:#fff;border-radius:999px;padding:10px 22px 10px 12px;font-size:42px;font-weight:600;display:flex;align-items:center;gap:12px;box-shadow:0 6px 16px rgba(43,31,24,.07);}
.tick span{width:52px;height:52px;border-radius:50%;background:#617C7B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;}
.bottom{margin-top:auto;padding-top:36px;display:flex;flex-direction:column;gap:29px;}
.info{background:#fff;border-left:12px solid #C19D5F;border-radius:20px;padding:26px 30px;box-shadow:0 8px 24px rgba(43,31,24,.08);}
.info .h{font-size:50px;font-weight:700;letter-spacing:.06em;color:#617C7B;text-transform:uppercase;}
.info .d{white-space:nowrap;font-family:'DM Serif Display',serif;font-size:75px;line-height:1.1;margin-top:4px;}
.info .t{font-size:55px;font-weight:600;color:#726651;margin-top:6px;}
.info .ad{display:flex;gap:8px;align-items:flex-start;font-size:36px;font-weight:600;color:#2B1F18;line-height:1.25;margin-top:12px;padding-top:10px;border-top:2px solid #F1E9DA;}
.info .ad svg{flex:none;margin-top:2px;}
.ticket{background:#B8593A;color:#FBF6EE;border-radius:20px;padding:8px;box-shadow:0 10px 26px rgba(184,89,58,.35);transform:rotate(-1deg);}
.ticket .in{border:3px dashed rgba(251,246,238,.7);border-radius:14px;padding:14px 14px 14px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.ticket .l{display:flex;align-items:baseline;gap:16px;}
.ticket .k{font-family:'DM Serif Display',serif;font-size:82px;line-height:1;}
.ticket .d{font-size:44px;font-weight:700;white-space:nowrap;}
.ticket .u{font-size:40px;font-weight:700;color:#F6DCC0;line-height:1.25;white-space:nowrap;margin-top:15px;}
</style></head><body>
