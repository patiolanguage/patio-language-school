<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;overflow:hidden;}
body{font-family:'Barlow',sans-serif;background:#FBF6EE;color:#2B1F18;position:relative;}
.bar{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#C19D5F,#B8593A);}
.wrap{position:absolute;left:64px;right:64px;top:36px;bottom:40px;display:flex;flex-direction:column;}
.head{display:flex;justify-content:space-between;align-items:center;height:110px;}
.head .logo{height:96px;}
.head .zh{font-family:'Noto Serif SC',serif;font-weight:600;font-size:60px;color:#2B1F18;}
.head .zh span{font-family:'DM Serif Display',serif;font-style:italic;font-weight:400;font-size:36px;color:#B8593A;margin-left:12px;}
.pic{position:relative;height:500px;margin-top:26px;flex:none;}
.pic .ph{width:100%;height:100%;object-fit:cover;object-position:center 40%;border-radius:28px;display:block;
  box-shadow:0 14px 34px rgba(43,31,24,.18);}
.stamp{position:absolute;left:-14px;bottom:-86px;width:260px;height:260px;border-radius:50%;
  background:#B8593A;color:#FBF6EE;display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-10deg);box-shadow:0 12px 30px rgba(184,89,58,.45);border:6px solid #FBF6EE;}
.stamp .big{font-family:'DM Serif Display',serif;font-size:70px;line-height:1;}
.stamp .small{text-align:center;max-width:80%;line-height:1.25;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:22px;margin-top:6px;color:#F6DCC0;}
.mich{position:absolute;right:24px;bottom:-90px;display:flex;flex-direction:column;align-items:center;gap:8px;}
.mich img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:7px solid #FBF6EE;box-shadow:0 8px 22px rgba(0,0,0,.25);}
.mich span{background:#2B1F18;color:#FBF6EE;font-weight:700;font-size:23px;padding:6px 16px;border-radius:999px;white-space:nowrap;}
.mich span b{color:#E9C58B;}
.text{margin-top:161px;}
.eyebrow{color:#B8593A;font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:28px;}
h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:84px;line-height:1.02;margin-top:8px;}
h1 .a{color:#B8593A;font-style:italic;}
.sub{font-size:34px;font-weight:500;color:#4a4038;margin-top:16px;line-height:1.25;}
.when{margin-top:22px;background:#fff;border-left:12px solid #C19D5F;border-radius:18px;padding:20px 26px;
  box-shadow:0 8px 24px rgba(43,31,24,.08);}
.when .d{font-size:42px;font-weight:700;line-height:1.15;}
.when .t{font-size:34px;font-weight:700;color:#B8593A;margin-top:4px;}
.when .t span{color:#726651;font-weight:600;}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;}
.pill{background:#617C7B;color:#FBF6EE;font-weight:700;font-size:31px;padding:20px 34px;border-radius:999px;}
.seats{color:#B8593A;font-weight:700;font-size:28px;text-align:right;}
</style></head><body>
