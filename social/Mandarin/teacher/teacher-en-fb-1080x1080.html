<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1080px;overflow:hidden;}
body{font-family:'Barlow',sans-serif;background:#FBF6EE;color:#2B1F18;position:relative;}
.bar{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#C19D5F,#B8593A);}
.wrap{position:absolute;left:56px;right:56px;top:36px;bottom:36px;display:flex;flex-direction:column;align-items:center;text-align:center;}
.top{position:relative;width:100%;height:250px;flex:none;}
.top .ph{width:100%;height:100%;object-fit:cover;object-position:center 45%;border-radius:30px;display:block;box-shadow:0 14px 34px rgba(43,31,24,.16);}
.top .logo{position:absolute;top:24px;left:28px;height:55px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.55));}
.top .pill{position:absolute;top:28px;right:28px;background:#B8593A;color:#FBF6EE;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-size:23px;padding:10px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.25);}
.mich{position:absolute;left:50%;transform:translateX(-50%);bottom:-180px;width:290px;height:290px;border-radius:50%;overflow:hidden;
  border:12px solid #FBF6EE;box-shadow:0 14px 34px rgba(0,0,0,.22);}
.mich img{width:100%;height:100%;object-fit:cover;object-position:center 30%;}
.hello{margin-top:198px;font-family:'DM Serif Display',serif;font-style:italic;font-size:32px;color:#B8593A;}
.name{font-family:'DM Serif Display',serif;font-size:76px;line-height:1;}
.role{font-size:26px;font-weight:600;color:#617C7B;letter-spacing:.04em;margin-top:8px;}
.quote{margin-top:12px;font-family:'DM Serif Display',serif;font-size:36px;line-height:1.15;max-width:92%;}
.quote span{color:#B8593A;font-style:italic;}
.quote:before{content:"\201C";color:#C19D5F;}
.quote:after{content:"\201D";color:#C19D5F;}
.facts{margin-top:12px;display:flex;flex-direction:column;gap:5px;align-items:center;}
.fact{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:9px 24px 9px 14px;font-size:24px;font-weight:600;
  box-shadow:0 6px 16px rgba(43,31,24,.07);}
.fact i{width:13px;height:13px;border-radius:50%;background:#C19D5F;display:block;flex:none;}
.ticket{margin-top:auto;background:#B8593A;color:#FBF6EE;border-radius:20px;padding:8px;box-shadow:0 10px 26px rgba(184,89,58,.35);transform:rotate(-1.5deg);}
.ticket .in{border:3px dashed rgba(251,246,238,.7);border-radius:14px;padding:12px 34px;display:flex;align-items:center;gap:26px;}
.ticket .k{white-space:nowrap;font-family:'DM Serif Display',serif;font-size:35px;line-height:1;}
.ticket .r{text-align:left;}
.ticket .d{white-space:nowrap;font-size:23px;font-weight:700;}
.ticket .u{font-size:21px;font-weight:600;color:#F6DCC0;margin-top:2px;}
</style></head><body>
